[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "order-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "asyncpg>=0.29",
    "pydantic>=2.0",
    "google-cloud-pubsub>=2.21",
    "python-dotenv>=1.0",
    "structlog>=24.0",
]
