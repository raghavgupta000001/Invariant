[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "invariant-shared"
version = "0.1.0"
description = "Shared models, DB helpers, and event publisher for Invariant"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "asyncpg>=0.29",
    "google-cloud-pubsub>=2.21",
    "python-dotenv>=1.0",
    "structlog>=24.0",
    "httpx>=0.27",
]
