[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "failure-generator"
version = "0.1.0"
description = "Invariant Failure Generator & Scenario Catalog Runner"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "structlog>=24.0",
]

